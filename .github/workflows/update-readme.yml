name: Update README

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: python3 update_readme.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update project stats"
          git push

      # GitHub disables scheduled workflows after 60 days without repo activity;
      # re-enabling via the API resets that clock even when nothing changed.
      - name: Keep schedule alive
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/update-readme.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
